# Compatibility settings required by FortiGate's FortiClient-flavoured
# IKEv2/EAP exchange.  These settings are understood by the locally patched
# strongSwan packages installed for this VPN only.
charon {
    # Keep the standard client-side IKE/NAT-T ports (UDP 500/4500).  Ephemeral
    # ports (port = 0) were tested against a real FortiGate behind a NAT
    # router: IKE_SA_INIT succeeded but IKE_AUTH replies never arrived.

    fortigate_auth_key = skp
    fortigate_suppress_eap_only = yes
    fortigate_send_forticlient_vid = yes
    fortigate_fct_file = /etc/strongswan.d/fct_data.txt

    plugins {
        # Avoid loading the unrelated SSH agent credential plugin.  Besides
        # not being needed here, it emits capability warnings.
        agent {
            load = no
        }
        # Do not install the DNS servers announced by the FortiGate.  They are
        # usually outside the split-tunnel ranges, so installing them would
        # break name resolution for the whole system.
        resolve {
            load = no
        }
    }
}

# swanctl loads its own plugin set; silence the same agent warning there.
swanctl {
    plugins {
        agent {
            load = no
        }
    }
}
