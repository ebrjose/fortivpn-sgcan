# Compatibility settings required by FortiGate's FortiClient-flavoured
# IKEv2/EAP exchange.  These settings are understood by the locally patched
# strongSwan packages installed for this VPN only.
charon {
    # Use ephemeral client-side IKE/NAT-T ports.  This avoids consumer-router
    # IPsec-passthrough state becoming pinned to another VPN client while the
    # FortiGate still receives traffic on its standard UDP 500/4500 ports.
    port = 0
    port_nat_t = 0

    fortigate_auth_key = skp
    fortigate_suppress_eap_only = yes
    fortigate_send_forticlient_vid = yes
    fortigate_fct_file = /etc/strongswan.d/fct_data.txt

    # Avoid loading the unrelated SSH agent credential plugin.  Besides not
    # being needed here, it emits capability warnings under charon-systemd.
    plugins {
        agent {
            load = no
        }
    }
}
